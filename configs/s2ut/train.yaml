architecture: s2ut_transformer
target: reduced_units
seed: 1
training:
  command:
    - python
    - -m
    - fairseq_cli.train
    - "{data_root}"
    - --task
    - speech_to_speech
    - --arch
    - s2ut_transformer
    - --config-yaml
    - config.yaml
    - --save-dir
    - "{run_root}/checkpoints"
    - --max-update
    - "{max_updates}"
    - --save-interval-updates
    - "{save_interval_updates}"
