architecture: translatotron2
implementation_status: experimental_native_core
voice_preservation: disabled
seed: 1
training:
  max_updates: 2
  save_interval_updates: 1
  command:
    - python
    - -m
    - direct_s2st.translatotron2.train
    - --data-root
    - "{data_root}"
    - --run-root
    - "{run_root}"
    - --max-updates
    - "{max_updates}"
    - --save-interval-updates
    - "{save_interval_updates}"
    - --device
    - cpu
    - --seed
    - "{seed}"
    - --model-size
    - smoke
