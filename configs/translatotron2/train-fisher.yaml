architecture: translatotron2
implementation_status: independent_reference_recipe
voice_preservation: disabled
seed: 1
# Shape/optimizer reference, not a claim of dataset or numerical reproduction.
# Exact refers to the effective batch, not dataset/G2P/frontend equivalence.
reference_global_batch: 1024
recommended_total_updates: null  # Not specified in Appendix A; researcher must choose.
training:
  max_updates: 2
  save_interval_updates: 1
  command:
    - python
    - -m
    - direct_s2st.translatotron2.train
    - --data-root
    - "{data_root}"
    - --run-root
    - "{run_root}"
    - --max-updates
    - "{max_updates}"
    - --save-interval-updates
    - "{save_interval_updates}"
    - --seed
    - "{seed}"
    - --device
    - cuda
    - --model-size
    - fisher
    - --reproduction-mode
    - paper_exact
    - --vocoder-mode
    - griffin_lim
    - --learning-rate
    - "0.0042"
    - --warmup-updates
    - "10000"
    - --l2-regularization
    - "0.000001"
    - --batch-size
    - "1"
    - --update-freq
    - "1024"
    - --validate-interval
    - "1"
