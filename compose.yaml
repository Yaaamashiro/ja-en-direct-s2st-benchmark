name: ja-en-direct-s2st-benchmark

services:
  benchmark:
    image: ja-en-direct-s2st-benchmark:locked
    build:
      context: .
      dockerfile: docker/common.Dockerfile
    environment:
      CORPUS_ROOT: /corpus
      EXPERIMENT_DATA_ROOT: /experiment-data
      RUNS_ROOT: /runs
      CACHE_ROOT: /cache
    volumes:
      - ${CORPUS_ROOT:-./data/corpus}:/corpus:ro
      - ${EXPERIMENT_DATA_ROOT:-./data/benchmark}:/experiment-data
      - ${RUNS_ROOT:-./runs}:/runs
      - ${CACHE_ROOT:-./.cache/benchmark}:/cache
      - ./configs:/workspace/configs:ro
    command: ["corpus", "validate", "--profile", "smoke", "--dry-run"]
